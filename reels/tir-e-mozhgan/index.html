<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>تیر مژگان</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#000;height:100%}canvas{display:block;height:100vh;width:auto;max-width:100vw;margin:0 auto}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="audio-data.js"></script>
<script src="film.js"></script>
<script>
// ?t=12.3 shows one frame; ?play plays with the song
const q = new URLSearchParams(location.search);
FILM.ready.then(() => {
  if (q.has('play')) {
    const a = new Audio('audio/song.wav'); a.play();
    const loop = () => { FILM.render(a.currentTime); if (!a.ended) requestAnimationFrame(loop); };
    document.body.onclick = () => a.play(); loop();
  } else FILM.render(parseFloat(q.get('t') || '1.5'));
});
</script>
</body></html>
