<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
// dark clinical palette + CREATOR LAB accents: life = brand green, painkiller = brand purple
const C={ink:'#06070A',panel:'#0E1016',line:'#232633',white:'#F4F5F7',mute:'#7D8190',
  lime:'#8FF23C',violet:'#8A3FFC',amber:'#FFB23F',red:'#FF2D3D',cyan:'#55E7FF',lung:'#FF8A9A',coral:'#FF5A4E'};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=420;const octx=off.getContext('2d');
</script>
<script src="helpers.js"></script>
<script>
const O=0.6, DUR=75;
let WT=[];
const w=(i,j)=>O+WT[i][j];

// ---------- breathing model: rate (breaths/min) and depth over time ----------
let PH=[],AMP=[],RATE=[],BREATHS=[],PULSES=[];const HZ=120;
function buildModel(){
  const tPain=w(4,1), tShallow=w(7,6), tAlc=w(8,4), tHit=w(11,2), tSup=w(12,5), tOff=w(14,11);
  const R=t=>{let r=16;r=L(r,11,k(t,tPain,2.5,EIO));r=L(r,6,k(t,tAlc,3,EIO));r=L(r,2.5,k(t,tHit,1.0,EIO));r=L(r,1.2,k(t,tSup,2.5,EIO));r=L(r,0,k(t,tOff,0.15));return r;};
  const A=t=>{let a=1;a=L(a,0.6,k(t,tShallow,1.2,EIO));a=L(a,0.42,k(t,tAlc,2,EIO));a=L(a,0.22,k(t,tHit,0.8));a=L(a,0.1,k(t,tSup,2));a=L(a,0,k(t,tOff,0.12));return a;};
  let ph=0.25,lastB=0,lastP=0;
  for(let i=0;i<=DUR*HZ;i++){const t=i/HZ;const r=R(t);ph+=r/60/HZ;PH.push(ph);AMP.push(A(t));RATE.push(r);
    if(Math.floor(ph)>lastB){lastB=Math.floor(ph);if(t>1.0&&t<tOff)BREATHS.push([t,A(t),r]);}
    if(Math.floor(ph*4)>lastP){lastP=Math.floor(ph*4);if(t>w(3,3)-0.2&&t<tHit+0.05)PULSES.push(t);}}
  window.T_HIT=tHit;window.T_OFF=tOff;window.T_PAIN=tPain;window.T_ALC=tAlc;
}
const at=(arr,t)=>arr[Math.max(0,Math.min(arr.length-1,Math.round(t*HZ)))];
function travel(te){return te<T_PAIN?1.0:te<T_ALC?1.7:2.5;}

// ---------- effects ----------
function shakeAt(t){let x=0,y=0;for(const [te,m] of SHAKES){if(t<te||t>te+1.5)continue;const d=t-te,e=m*Math.exp(-d*7);x+=e*Math.sin(d*71+te);y+=e*Math.cos(d*53+te*2);}return [x,y];}
let SHAKES=[];
function glitchText(s,x,y,sz,col,amt,t,seed=1,wg=900){
  octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,W,off.height);
  octx.font=`${wg} ${sz}px Vaz`;octx.direction='rtl';octx.textAlign='center';octx.textBaseline='middle';
  const cy=off.height/2;
  const fr=Math.floor(t*24);
  ctx.save();
  if(amt>0.02){
    octx.fillStyle=C.red;octx.fillText(s,W/2,cy);ctx.globalAlpha=0.8*Math.min(1,amt*2);ctx.globalCompositeOperation='lighter';
    ctx.drawImage(off,x-W/2-14*amt,y-cy);octx.clearRect(0,0,W,off.height);octx.fillStyle=C.cyan;octx.fillText(s,W/2,cy);ctx.drawImage(off,x-W/2+14*amt,y-cy+3*amt);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;octx.clearRect(0,0,W,off.height);}
  octx.fillStyle=col;octx.fillText(s,W/2,cy);
  // horizontal slice displacement — image-level, joins stay intact
  const n=12,hh=off.height/n;
  for(let i=0;i<n;i++){const r=rnd(i*13+fr*7+seed);const dx=(r>1-amt*0.6)?(rnd(i+fr+seed*3)-0.5)*90*amt:0;
    ctx.drawImage(off,0,i*hh,W,hh,x-W/2+dx,y-cy+i*hh,W,hh);}
  ctx.restore();
}
function vignette(a){const g=ctx.createRadialGradient(540,960,200,540,960,1150);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(-200,-200,W+400,H+400);}
function scanlines(a){ctx.fillStyle=`rgba(0,0,0,${a})`;for(let y=0;y<H;y+=6)ctx.fillRect(0,y,W,2);}
function boil(t,i){return (rnd(i*7.3+Math.floor(t*12)*1.7)-0.5)*2.2;}

// ---------- props ----------
function capsule(x,y,s,rot,cA=C.violet,cB=C.white,a=1){ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);
  ctx.fillStyle=cA;rr(-s,-s*0.42,s,s*0.84,s*0.42);ctx.fill();ctx.fillStyle=cB;rr(0,-s*0.42,s,s*0.84,s*0.42);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';rr(-s*0.8,-s*0.3,s*1.4,s*0.14,s*0.07);ctx.fill();ctx.restore();}
function glass(x,y,s,fill,a=1,slosh=0){ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);
  const tw=s*0.62,bw=s*0.5,h=s*1.1;
  ctx.save();ctx.beginPath();ctx.moveTo(-tw,-h/2);ctx.lineTo(tw,-h/2);ctx.lineTo(bw,h/2);ctx.lineTo(-bw,h/2);ctx.closePath();ctx.clip();
  const ly=L(h/2,-h*0.05,fill);ctx.fillStyle=C.amber;ctx.beginPath();ctx.moveTo(-tw,ly+slosh*s*0.08);ctx.lineTo(tw,ly-slosh*s*0.08);ctx.lineTo(tw,h);ctx.lineTo(-tw,h);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';rr(-s*0.25,ly-s*0.05,s*0.3,s*0.3,s*0.05);ctx.fill();rr(s*0.05,ly+s*0.12,s*0.26,s*0.26,s*0.05);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(244,245,247,.9)';ctx.lineWidth=s*0.06;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-tw,-h/2);ctx.lineTo(-bw,h/2);ctx.lineTo(bw,h/2);ctx.lineTo(tw,-h/2);ctx.stroke();
  ctx.lineWidth=s*0.1;ctx.beginPath();ctx.moveTo(-bw,h/2);ctx.lineTo(bw,h/2);ctx.stroke();ctx.restore();}

// ---------- anatomy (line art, hand-drawn boil) ----------
const BR={x:540,y:720}, LU={x:540,y:1250};
const NERVE_TOP=840, NERVE_BOT=1090;
function brain(t,a,col){ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor=col;ctx.shadowBlur=24;
  ctx.beginPath();ctx.ellipse(BR.x+boil(t,1),BR.y+boil(t,2),150,108,0,0,7);ctx.stroke();
  for(let i=0;i<7;i++){const ang=-2.6+i*0.55,r1=40+rnd(i)*20,r2=105+rnd(i+5)*20;ctx.beginPath();
    ctx.moveTo(BR.x+Math.cos(ang)*r1+boil(t,i+10),BR.y+Math.sin(ang)*r1*0.72);
    ctx.quadraticCurveTo(BR.x+Math.cos(ang+0.3)*(r1+r2)/2,BR.y+Math.sin(ang+0.3)*(r1+r2)/2*0.72+boil(t,i+20),BR.x+Math.cos(ang)*r2,BR.y+Math.sin(ang)*r2*0.72);ctx.stroke();}
  // brain stem
  ctx.beginPath();ctx.moveTo(BR.x-26,BR.y+80);ctx.quadraticCurveTo(BR.x-20+boil(t,40),NERVE_TOP-20,BR.x-14,NERVE_TOP);ctx.moveTo(BR.x+26,BR.y+80);ctx.quadraticCurveTo(BR.x+20,NERVE_TOP-20,BR.x+14,NERVE_TOP);ctx.stroke();
  ctx.restore();}
function lungs(t,a,breath,grey){ctx.save();ctx.globalAlpha*=a;const s=1+0.07*breath;ctx.translate(LU.x,LU.y);ctx.scale(s,s);
  const col=mix(C.lung,'#4A4D57',grey);ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.shadowColor=col;ctx.shadowBlur=30*(1-grey);
  for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(sd*40,-150);
    ctx.bezierCurveTo(sd*150+boil(t,sd*3),-190,sd*250,-40,sd*235,120+boil(t,sd*5));ctx.bezierCurveTo(sd*225,200,sd*110,215,sd*55,150);ctx.bezierCurveTo(sd*40,60,sd*45,-60,sd*40,-150);
    ctx.fillStyle=grey<0.5?`rgba(255,138,154,${0.10+0.12*breath})`:'rgba(80,80,90,.10)';ctx.fill();ctx.stroke();
    // bronchial tree
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(sd*8,-120);ctx.lineTo(sd*60,-40);ctx.lineTo(sd*120,20);ctx.moveTo(sd*60,-40);ctx.lineTo(sd*90,80);ctx.moveTo(sd*120,20);ctx.lineTo(sd*170,60);ctx.moveTo(sd*120,20);ctx.lineTo(sd*150,120);ctx.stroke();ctx.lineWidth=6;}
  ctx.beginPath();ctx.moveTo(0,-170);ctx.lineTo(0,-120);ctx.stroke();
  ctx.restore();}

// ---------- the breathing monitor (carries the whole film) ----------
function monitor(t,x,y,w,h,a){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;
  const flat=t>=T_OFF;const danger=Math.min(1,Math.max(0,(16-at(RATE,t))/14));
  const col=flat?C.red:mix(C.lime,C.red,danger);
  ctx.fillStyle='rgba(8,10,14,.92)';rr(x,y,w,h,28);ctx.fill();ctx.strokeStyle=mix('#232633',C.red,danger*0.7);ctx.lineWidth=3;ctx.stroke();
  // grid
  ctx.strokeStyle='rgba(143,242,60,.07)';ctx.lineWidth=1;for(let gx=x+20;gx<x+w-220;gx+=30){ctx.beginPath();ctx.moveTo(gx,y+12);ctx.lineTo(gx,y+h-12);ctx.stroke();}
  // waveform: last 7 seconds
  const ww=w-260,span=7,base=y+h/2+6;
  ctx.save();ctx.beginPath();ctx.rect(x+16,y+8,ww,h-16);ctx.clip();
  ctx.strokeStyle=col;ctx.lineWidth=5;ctx.shadowColor=col;ctx.shadowBlur=16;ctx.beginPath();
  for(let i=0;i<=ww;i+=3){const tt=t-span+span*i/ww;if(tt<0)continue;const v=at(AMP,tt)*Math.sin(2*Math.PI*at(PH,tt));
    const yy=base-v*(h*0.33)+(rnd(i+Math.floor(tt*30))-0.5)*1.5;if(i===0)ctx.moveTo(x+16+i,yy);else ctx.lineTo(x+16+i,yy);}
  ctx.stroke();
  // leading dot
  const v=at(AMP,t)*Math.sin(2*Math.PI*at(PH,t));ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+16+ww,base-v*(h*0.33),8,0,7);ctx.fill();ctx.restore();
  // readout
  const r=Math.round(at(RATE,t));
  ctx.fillStyle=col;ctx.font='900 92px Vaz';ctx.direction='ltr';ctx.textAlign='center';ctx.shadowColor=col;ctx.shadowBlur=20;
  const blink=flat&&Math.floor(t*2.5)%2===0;if(!blink)ctx.fillText(fa(r),x+w-118,y+h/2+28);ctx.shadowBlur=0;
  txt('تنفس در دقیقه',x+w-118,y+h-22,26,700,'rgba(244,245,247,.6)');
  txt(flat?'⚠ بدون تنفس':'● زنده',x+w-118,y+40,24,800,col);
  ctx.restore();}

// ---------- scenes ----------
function sceneA(t){ // cold open
  const fl=t<0.6?(rnd(Math.floor(t*30))>0.6?1:0):0;
  if(fl){ctx.fillStyle='rgba(255,45,61,.18)';ctx.fillRect(0,0,W,H);}
  // pills rain on «مصرف زیاد», shatter on «نیست»
  const t0=w(0,4)-0.2,t1=w(0,6);
  if(t>t0&&t<w(1,0)+0.4){for(let i=0;i<46;i++){const sx=60+rnd(i)*960,st=t0+rnd(i+9)*0.6,vy=900+rnd(i+3)*700;if(t<st)continue;
      let d=Math.min(t,t1)-st,yy=-80+vy*d,xx=sx,rot=rnd(i+5)*6+d*(rnd(i+2)-0.5)*4;
      if(t>t1){const e=t-t1;xx+=(rnd(i+11)-0.5)*900*e;yy+=-300*e+1600*e*e;rot+=e*8;}
      capsule(xx,yy,34+rnd(i+7)*20,rot,[C.violet,C.coral,C.amber,C.cyan][i%4],C.white,t>t1?Math.max(0,1-(t-t1)*1.2):1);}}
  const ex=w(1,0)-0.15;
  // the title word, glitching
  const p=k(t,O,0.25);
  if(p>0&&t<ex+0.3){const g=Math.max(0.15,1-(t-O)*0.9)+(Math.abs(t-t1)<0.25?1:0);const sz=L(250,170,k(t,O+0.9,0.6,EIO)),yy=L(860,430,k(t,O+0.9,0.6,EIO));
    ctx.save();ctx.globalAlpha=1-k(t,ex,0.25,EI);ctx.translate(540,yy);const s=L(1.4,1,p);ctx.scale(s,s);glitchText('اوردوز',0,0,sz,C.red,Math.min(1,g),t,3);ctx.restore();}
  line(t,[Wd('همیشه',w(0,1)),Wd('به',w(0,2)),Wd('خاطر',w(0,3))],660,78,{w:700,exit:ex});
  line(t,[Wd('مصرف',w(0,4)),Wd('زیاد',w(0,5),{bg:C.white,c:C.ink})],810,112,{w:900,exit:ex});
  // «نیست» stamps over and strikes the line
  const np=k(t,t1,0.2);
  if(np>0&&t<ex+0.3){ctx.save();ctx.globalAlpha=1-k(t,ex,0.25,EI);ctx.strokeStyle=C.red;ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(800,780);ctx.lineTo(L(800,280,np),780+L(0,30,np));ctx.stroke();
    ctx.translate(540,1010);ctx.rotate(-0.06);const s=L(2.2,1,np);ctx.scale(s,s);ctx.fillStyle=C.red;rr(-170,-80,340,150,22);ctx.fill();txt('نیست.',0,30,110,900,C.white);ctx.restore();}
}
function sceneB(t){ // tiny amounts → lungs fail (teaser)
  const ex=w(2,0)-0.1;if(t>ex+0.2)return;const a=1-k(t,ex,0.2,EI);
  ctx.save();ctx.globalAlpha=a;
  line(t,[Wd('گاهی',w(1,0)),Wd('ترکیب',w(1,1),{bg:C.violet})],360,112,{w:900});
  // «بسیار کم» drawn deliberately tiny
  line(t,[Wd('مقادیر',w(1,2))],520,96,{w:800});
  const tp=k(t,w(1,3),0.4);if(tp>0){ctx.save();ctx.globalAlpha*=tp;txt('بسیار کم',540,600,34,800,C.amber);ctx.strokeStyle=C.amber;ctx.lineWidth=3;ctx.beginPath();ctx.arc(540,590,95,0,7*tp);ctx.stroke();ctx.restore();}
  // one small pill + one drop drift together
  const m=k(t,w(1,1),2.2,EIO);if(m>0){capsule(L(780,575,m),L(860,880,m),26,0.4+m,C.violet,C.white,1-k(t,w(1,5),0.3));
    ctx.save();ctx.fillStyle=C.amber;ctx.globalAlpha*=1-k(t,w(1,5),0.3);const dx=L(300,505,m),dy=L(860,880,m);ctx.beginPath();ctx.moveTo(dx,dy-30);ctx.quadraticCurveTo(dx+22,dy,dx,dy+14);ctx.quadraticCurveTo(dx-22,dy,dx,dy-30);ctx.fill();ctx.restore();}
  // lungs appear, then fail with a glitch on «از کار»
  const lp=k(t,w(1,5),0.4),fail=k(t,w(1,9),0.25);
  if(lp>0){ctx.save();ctx.translate(540,L(1250,1150,lp));ctx.scale(lp,lp);ctx.translate(-540,-1250);lungs(t,1,0.6*(1-fail)*Math.max(0,Math.sin(t*5)),fail);ctx.restore();
    if(fail>0){glitchText('ریه‌ها از کار می‌افتن',540,1430,72,C.red,0.8*(1-k(t,w(1,9)+0.6,0.6))+0.2,t,8,900);}}
  if(t<w(1,9))line(t,[Wd('ریه‌ها',w(1,5)),Wd('رو',w(1,7)),Wd('کاملاً',w(1,8),{c:C.red})],1430,84,{w:900});
  ctx.restore();
}
function sceneC(t){ // the equation
  const s=w(2,0)-0.05,ex=w(3,0)-0.2;if(t<s||t>ex+1.2)return;
  line(t,[Wd('مثلاً',w(2,0))],330,70,{w:700,c:C.mute,exit:ex});
  const pin=k(t,w(2,2),0.5),gin=k(t,w(2,8),0.5),fly=k(t,ex,0.9,EIO);
  // pill (right) and glass (left); afterwards they fly away and return later
  if(pin>0){const px=L(1200,770,pin),py=900;capsule(L(px,1250,fly),L(py,700,fly),95,-0.35+0.2*Math.sin(t*2),C.violet,C.white,1);
    if(fly<0.5){ctx.save();ctx.globalAlpha=pin*(1-fly*2);txt('مسکن',770,1080,72,900,C.white);
      const tp=k(t,w(2,3),0.4);if(tp>0){ctx.globalAlpha*=tp;ctx.fillStyle=C.violet;rr(620,1110,300,70,35);ctx.fill();txt('تجویز شده',770,1158,40,800,C.white);}ctx.restore();}}
  const plus=k(t,w(2,5),0.35);if(plus>0&&fly<0.5){ctx.save();ctx.globalAlpha=1-fly*2;ctx.translate(540,900);ctx.rotate((1-plus)*2);ctx.scale(plus,plus);txt('+',0,36,140,900,C.white);ctx.restore();}
  if(gin>0){glass(L(L(-200,310,gin),-250,fly),L(900,700,fly),120,k(t,w(2,8)+0.2,0.8),1,Math.sin(t*4)*(1-k(t,w(2,8),1.5)));
    if(fly<0.5){ctx.save();ctx.globalAlpha=gin*(1-fly*2);txt('یک لیوان',310,1080,72,900,C.white);
      const tp=k(t,w(2,9),0.4);if(tp>0){ctx.globalAlpha*=tp;ctx.fillStyle=C.amber;rr(160,1110,300,70,35);ctx.fill();txt('نوشیدنی الکلی',310,1158,40,800,C.ink);}ctx.restore();}}
  // = ?
  const q=k(t,w(2,10)+0.35,0.35);if(q>0&&fly<0.6){ctx.save();ctx.globalAlpha=1-fly*1.7;const pulse=1+0.06*Math.sin(t*9);ctx.translate(540,1420);ctx.scale(q*pulse,q*pulse);
    ctx.fillStyle=C.red;ctx.shadowColor=C.red;ctx.shadowBlur=40;rr(-130,-100,260,200,40);ctx.fill();ctx.shadowBlur=0;txt('= ؟',0,40,120,900,C.white);ctx.restore();}
}
function diagram(t){ // brain stem → nerve → lungs, the explainer spine
  const s=w(3,0)-0.3;if(t<s||t>w(14,0)+0.6)return;
  const da=k(t,s,0.8)*(1-k(t,w(14,0),0.5,EI));
  const sup=k(t,w(12,5),2.0),dead=k(t,w(11,2),0.6);
  const breath=at(AMP,t)*Math.max(0,Math.sin(2*Math.PI*at(PH,t)));
  // draw-on of the lines
  ctx.save();ctx.globalAlpha=da;
  brain(t,1,mix(C.cyan,'#5A6070',dead*0.8));
  // nerve
  const nc=t<T_PAIN?C.lime:t<T_ALC?mix(C.lime,C.violet,k(t,T_PAIN,1)):mix(C.violet,C.amber,k(t,T_ALC,1));
  const ncol=mix(nc,'#3A3D48',dead);
  ctx.strokeStyle=ncol;ctx.lineWidth=7;ctx.shadowColor=ncol;ctx.shadowBlur=20*(1-dead);ctx.setLineDash(dead>0.5?[18,16]:[]);
  const draw=k(t,s+0.3,0.9,EIO);ctx.beginPath();ctx.moveTo(540,NERVE_TOP);
  for(let yy=NERVE_TOP;yy<=L(NERVE_TOP,NERVE_BOT,draw);yy+=10)ctx.lineTo(540+Math.sin(yy*0.035)*10+boil(t,yy),yy);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=0;
  lungs(t,k(t,s+0.6,0.6),breath,Math.max(sup,dead*0.4));
  // pulses
  for(const te of PULSES){if(te>t)break;const tr=travel(te);let p=(t-te)/tr;
    let fade=1;if(t>T_HIT){p=Math.min(p,(T_HIT-te)/tr);fade=1-k(t,T_HIT+0.2,0.6);} // freeze and die
    if(p<0||p>1||fade<=0)continue;const yy=L(NERVE_TOP,NERVE_BOT,p);ctx.save();ctx.globalAlpha*=fade;ctx.fillStyle=t>T_HIT?C.red:nc;ctx.shadowColor=nc;ctx.shadowBlur=30;
    ctx.beginPath();ctx.arc(540+Math.sin(yy*0.035)*10,yy,15,0,7);ctx.fill();ctx.restore();}
  // labels
  const l1=k(t,w(3,0),0.4),l2=k(t,s+0.9,0.4);
  ctx.save();ctx.globalAlpha*=l1;ctx.fillStyle=C.cyan;rr(720,640,240,64,32);ctx.fill();txt('ساقه مغز',840,684,38,900,C.ink);ctx.restore();
  ctx.save();ctx.globalAlpha*=l2;ctx.fillStyle=mix(C.lung,'#555',sup);rr(760,1360,200,64,32);ctx.fill();txt('ریه‌ها',860,1404,38,900,C.ink);ctx.restore();
  // the pill sticks onto the nerve, the glass joins later
  const pp=k(t,w(4,1)-0.1,0.7,EIO);if(pp>0)capsule(L(1250,610,pp),L(700,950,pp),54,L(-0.4,1.4,pp)+0.05*Math.sin(t*3),C.violet,C.white,1);
  if(pp>0.9){ctx.save();ctx.globalAlpha*=k(t,w(4,1)+0.6,0.4)*0.5*(1+Math.sin(t*4))*0.5;ctx.strokeStyle=C.violet;ctx.lineWidth=4;ctx.beginPath();ctx.arc(610,950,70+10*Math.sin(t*4),0,7);ctx.stroke();ctx.restore();}

function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);
  const offT=T_OFF, crt0=offT+0.35, crt1=crt0+0.55;
  if(t>=crt1){ // after the CRT collapse: black + end card
    endCard(t);return;}
  // background: faint medical grid, red tint creeping in as breathing fails
  const danger=Math.min(1,Math.max(0,(16-at(RATE,t))/16));
  const g=ctx.createRadialGradient(540,1000,100,540,1000,1100);g.addColorStop(0,mix('#0B1220','#2A0A10',danger));g.addColorStop(1,C.ink);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(85,231,255,.05)';const off2=(t*20)%80;for(let y=-80;y<H+80;y+=80)for(let x=40;x<W;x+=80){ctx.fillRect(x-1,y+off2-1,3,3);}
  // camera: slow push + impulse shakes + CRT collapse
  const [sx,sy]=shakeAt(t);let z=1+0.035*Math.sin(t*0.4)+0.04*k(t,w(13,0),3,EIO);
  ctx.save();ctx.translate(540+sx,960+sy);
  if(t>crt0){const c=(t-crt0)/(crt1-crt0);const vy=Math.max(0.004,1-EI(Math.min(1,c*1.8)));const vx=c>0.55?Math.max(0.002,1-EI((c-0.55)/0.45)):1;ctx.scale(vx,vy);}
  ctx.scale(z,z);ctx.translate(-540,-960);
  sceneA(t);sceneB(t);sceneC(t);diagram(t);overlays(t);sceneL(t);
  const mp=monitorPlacement(t);monitor(t,mp.x,mp.y,mp.w,mp.h,mp.a);
  ctx.restore();
  // closing darkness during «deadly accumulation»
  vignette(0.55+0.4*k(t,w(13,0),3));
  scanlines(0.10);
  if(t>crt0){const c=(t-crt0)/(crt1-crt0);ctx.fillStyle=`rgba(255,255,255,${0.5*Math.sin(Math.PI*Math.min(1,c))})`;ctx.fillRect(0,0,W,H);}
  // brand bar
  ctx.save();ctx.globalAlpha=0.55*k(t,1.2,0.6);ctx.font='800 26px "Inter Display", Inter';ctx.direction='ltr';ctx.textAlign='left';let x=60;
  for(const ch of 'CREATOR LAB'){ctx.fillStyle=x>230?C.lime:C.white;ctx.fillText(ch,x,110);x+=ctx.measureText(ch).width+6;}ctx.restore();
}
